[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geomodeling-platform"
version = "0.1.0"
description = "Underground resistivity 3D property simulation MVP"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.26",
  "pydantic>=2.0",
  "typer>=0.12",
  "rich>=13.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
geomodeling = "geomodeling.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
