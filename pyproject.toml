[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geomodeling-platform"
version = "0.3.0"
description = "Underground resistivity 3D property simulation MVP"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.0,<3.0",
  "numpy>=1.26,<3.0",
  "pydantic>=2.0,<3.0",
  "typer>=0.12,<0.30",
  "rich>=13.0,<15.0",
  "PyYAML>=6.0,<7.0",
  "scipy>=1.14,<2.0",
  "SQLAlchemy>=2.0,<3.0",
  "pyarrow>=17,<24",
  "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.29,<1.0",
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.9,<1.0",
]
test = [
  "pytest>=8.0,<10.0",
  "fastapi>=0.110,<1.0",
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.9,<1.0",
]

[project.scripts]
geomodeling = "geomodeling.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "local_data: tests that require adjacent read-only reference data",
]
