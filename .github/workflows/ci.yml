name: CI

on:
  push:
  pull_request:

jobs:
  portable-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: CLI help smoke
        run: python -m geomodeling.cli --help

      - name: Run portable tests
        run: python -m pytest -q -m "not local_data"
