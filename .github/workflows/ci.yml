name: CI

on:
  push:
  pull_request:

jobs:
  portable-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: CLI help smoke
        run: python -m geomodeling.cli --help

      - name: Run portable tests
        run: python -m pytest -q -m "not local_data"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Frontend unit tests
        run: npm --prefix web run test:unit

      - name: Frontend type-check
        run: npm --prefix web run type-check

      - name: Frontend build
        run: npm --prefix web run build

  browser-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Frontend build
        run: npm --prefix web run build

      - name: Install Chromium for Playwright
        run: npx --prefix web playwright install chromium

      - name: Browser smoke (mock API, no iServer)
        run: npm --prefix web run test:e2e

  browser-live:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Allocate isolated live runtime
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "geomodeling-live-${{ github.run_id }}-${{ github.run_attempt }}"
          "GEOMODELING_DATA_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Frontend build
        run: npm --prefix web run build

      - name: Install Chromium for Playwright
        run: npx --prefix web playwright install chromium

      - name: Live E2E (real FastAPI + isolated SQLite)
        run: npm --prefix web run test:e2e:live

      - name: Upload live failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-live-evidence
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7
