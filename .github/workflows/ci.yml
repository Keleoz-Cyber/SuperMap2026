name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  portable-tests:
    runs-on: windows-latest
    env:
      # Windows runner 默认 cp1252 控制台，中文 CLI 帮助会触发 UnicodeEncodeError
      PYTHONUTF8: "1"
      # main 普通 push 走快速门；版本标签和人工触发才跑完整发布门。
      FULL_CI: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 证据身份合同测试（test_v070_ci_contract）需要完整历史做
          # merge-base 祖先判定；默认浅克隆无法验证证据 git_commit。
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[api,test]"

      - name: CLI help smoke
        run: python -m geomodeling.cli --help

      - name: Run fast Python contract tests
        if: env.FULL_CI != 'true'
        run: python -m pytest -q tests/test_version_consistency.py tests/test_runtime_paths.py tests/test_portable.py tests/test_portable_build.py tests/test_api.py::test_health tests/test_platform_api_contract.py::test_health_reports_current_version tests/test_ci_contract.py tests/test_v05_ci_contract.py tests/test_v06_ci_contract.py tests/test_two_speed_ci_contract.py

      - name: Run full portable tests
        if: env.FULL_CI == 'true'
        run: python -m pytest -q -m "not local_data"

      - name: SuperMap3D installer help smoke
        run: python scripts/install_supermap3d.py --help

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Frontend unit tests
        run: npm --prefix web run test:unit

      - name: Frontend type-check
        run: npm --prefix web run type-check

      - name: Frontend build
        run: npm --prefix web run build

  browser-smoke:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Frontend build
        run: npm --prefix web run build

      - name: Install Chromium for Playwright
        run: npx --prefix web playwright install chromium

      - name: Browser smoke (mock API, no iServer)
        run: npm --prefix web run test:e2e

  browser-live:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Allocate isolated live runtime
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "geomodeling-live-${{ github.run_id }}-${{ github.run_attempt }}"
          "GEOMODELING_DATA_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # 微震合同指向隔离目录内运行时生成的合成夹具配置（由 e2e-live 夹具现造，绝不用真实私有配置）
          "GEOMODELING_MICROSEISMIC_CONFIG=$(Join-Path $dir 'microseismic-live\microseismic_live_fixture.yaml')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[api,test]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Frontend build
        run: npm --prefix web run build

      - name: Install Chromium for Playwright
        run: npx --prefix web playwright install chromium

      # 专有 SuperMap3D SDK 不入库，SDK 依赖的 live 门（supermap-volume-frame-live、
      # supermap-native-volume-live）仅作本机发布门；CI 只跑平台 live 流程。
      - name: Live E2E (real FastAPI + isolated SQLite)
        run: npm --prefix web run test:e2e:live -- e2e-live/platform-live.spec.ts

      - name: Upload live failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-live-evidence
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7
